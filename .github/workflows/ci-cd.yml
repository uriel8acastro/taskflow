name: TaskFlow CI/CD

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Build y pruebas automatizadas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Ejecutar pruebas automatizadas
        run: npm test

  build-and-smoke-test:
    name: Construir imagen y smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir imagen Docker (taskflow-infra)
        run: docker build -f infra/Dockerfile -t taskflow:ci .

      - name: Levantar contenedor
        run: docker run -d -p 3000:3000 --name taskflow-ci taskflow:ci

      - name: Esperar a que el servicio esté listo
        run: |
          for i in {1..10}; do
            if curl -sf http://localhost:3000/api/health; then
              echo "Servicio disponible."
              exit 0
            fi
            echo "Esperando servicio... intento $i"
            sleep 2
          done
          echo "El servicio no respondió a tiempo."
          docker logs taskflow-ci
          exit 1

      - name: Smoke test — health check
        run: curl -sf http://localhost:3000/api/health | grep '"status":"ok"'

      - name: Detener contenedor
        if: always()
        run: docker rm -f taskflow-ci || true

  # NOTA: en un entorno real, aquí seguiría un job "deploy" que promueve la imagen
  # a un registro de artefactos y la despliega a producción (p. ej. con un tag
  # de versión). Se omite en este ejemplo académico para no depender de
  # credenciales de un proveedor cloud específico.
